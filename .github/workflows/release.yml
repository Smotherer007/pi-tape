name: Release

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm provenance: it lets the registry verify that this exact
  # commit and workflow produced the tarball.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      # The published package cannot ship only TypeScript: node refuses to strip
      # types under node_modules, so an installed `pi-tape` binary would fail on its
      # first line. The sources are still shipped (pi loads TypeScript extensions
      # from a checkout, and they are worth reading), but the bin and the extension
      # entry point are compiled.
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release
