name: Release

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required for npm provenance: it lets the registry verify that this exact
  # commit and workflow produced the tarball.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      # The published package cannot ship only TypeScript: node refuses to strip
      # types under node_modules, so an installed `pi-tape` binary would fail on its
      # first line. The sources are still shipped (pi loads TypeScript extensions
      # from a checkout, and they are worth reading), but the bin and the extension
      # entry point are compiled.
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Pinned, not inherited: an ambient dry-run makes `npm publish` exit 0
          # without publishing, and then the job is green while the registry never
          # saw the version.
          NPM_CONFIG_DRY_RUN: "false"
        run: npx semantic-release

      # A green release job is not by itself evidence that the version reached the
      # registry, so this checks. It waits, and it has to: npm's registry takes
      # minutes to show a new version, and the packument is served from a CDN.
      # Measured on this package, 1.1.2 was tagged at 07:07:40 and fetchable at
      # 07:11:48. An earlier version of this check waited 90 seconds and reported a
      # failed publish that had in fact succeeded -- a guard that cries wolf is the
      # failure mode it was meant to prevent, read from the other end.
      - name: Verify the released version is on npm
        env:
          NPM_CONFIG_DRY_RUN: "false"
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 20); do
            if npm view "@patimweb/pi-tape@${version}" version --prefer-online >/dev/null 2>&1; then
              echo "npm has @patimweb/pi-tape@${version}"
              exit 0
            fi
            echo "not on npm yet (attempt ${attempt}/20)"
            sleep 30
          done
          echo "::error::release ${version} was tagged ten minutes ago and is still not on npm -- read the Release step above"
          exit 1
